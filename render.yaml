services:
  - type: web
    name: veritas-media-lab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veritas-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false

databases:
  - name: veritas-db
    databaseName: veritas
    user: veritas_app
    plan: free
